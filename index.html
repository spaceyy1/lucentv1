<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lucent</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" id="appFavicon" href="/logo.jpg">
    <style>
      :root {
        --bg: #020303;
        --bg-2: #070a0d;
        --chrome: #0a0d0f;
        --chrome-2: #101418;
        --chrome-3: #171d22;
        --panel: rgba(255, 255, 255, 0.015);
        --panel-strong: rgba(255, 255, 255, 0.03);
        --line: rgba(255, 255, 255, 0.06);
        --text: #f0f1f2;
        --muted: rgba(255, 255, 255, 0.45);
        --muted-strong: rgba(255, 255, 255, 0.7);
        --accent: #7add7e;
      }

      * {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M5 3L18.5 12.5L12 13.5L15 21L11.5 22L8.5 15L5 18V3Z" fill="white" opacity="0.95"/><circle cx="5" cy="3" r="1.8" fill="white" opacity="0.95"/></svg>') 0 0, auto;
      }

      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }

      ::selection {
        color: #f4f1e8;
        background: rgba(137, 119, 83, 0.72);
      }

      ::-moz-selection {
        color: #f4f1e8;
        background: rgba(137, 119, 83, 0.72);
      }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: "Segoe UI", sans-serif;
      }

      body {
        overflow: hidden;
      }

      .browser {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: var(--bg);
      }

      #backgroundParticles {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .window-header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 44px;
        display: flex;
        align-items: center;
        background: linear-gradient(to bottom, rgba(9,11,13,0.98), rgba(6,8,10,0.98));
        border-bottom: 1px solid rgba(255, 255, 255, 0.025);
        z-index: 10;
      }

      .window-dots {
        position: absolute;
        left: 18px;
        display: flex;
        gap: 8px;
        opacity: 0;
        pointer-events: none;
      }

      .window-dots span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        display: inline-block;
      }

      .address-row {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: min(550px, 44vw);
        height: 30px;
        border-radius: 999px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.025)),
          rgba(8, 10, 12, 0.76);
        border: 1px solid rgba(255, 255, 255, 0.09);
        display: flex;
        align-items: center;
        padding: 0 13px;
        color: rgba(238, 241, 244, 0.88);
        font-size: 12px;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.035),
          0 2px 8px rgba(0, 0, 0, 0.2);
        backdrop-filter: blur(12px);
        transition: border-color 150ms ease, background 150ms ease, box-shadow 150ms ease;
      }

      .address-row:hover {
        border-color: rgba(255, 255, 255, 0.14);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.035)),
          rgba(8, 10, 12, 0.82);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.045),
          0 3px 12px rgba(0, 0, 0, 0.24);
      }

      .address-row .lock {
        width: 13px;
        height: 13px;
        flex: 0 0 13px;
        margin-right: 9px;
        color: rgba(210, 218, 226, 0.78);
        filter: drop-shadow(0 0 4px rgba(210, 218, 226, 0.12));
      }

      .address-row .text {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        opacity: 0.82;
      }

      .toolbar-icons {
        position: absolute;
        right: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        opacity: 0.75;
      }

      .toolbar-icons .icon {
        width: 14px;
        height: 14px;
        position: relative;
        display: inline-block;
        filter: brightness(0.9);
      }

      .icon.menu::before,
      .icon.menu::after,
      .icon.menu span {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 1.4px;
        background: rgba(255, 255, 255, 0.65);
        border-radius: 4px;
      }

      .icon.menu::before { top: 2px; }
      .icon.menu span { top: 6px; }
      .icon.menu::after { top: 10px; }

      .icon.square {
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 2px;
        opacity: 0.8;
      }

      .icon.cloud {
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 50% 50% 40% 40%;
        width: 15px;
        height: 10px;
        opacity: 0.8;
      }

      .icon.cloud::before {
        content: "";
        position: absolute;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.6);
        left: 2px;
        top: -4px;
      }

      .icon.cloud::after {
        content: "";
        position: absolute;
        width: 8px;
        height: 7px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.6);
        right: 1px;
        top: -2px;
      }

      .sidebar {
        position: absolute;
        left: 0;
        top: 44px;
        width: 48px;
        bottom: 0;
        background: rgba(6, 9, 12, 0.94);
        border-right: 1px solid rgba(255, 255, 255, 0.03);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 14px;
        padding-bottom: 6px;
        gap: 12px;
        z-index: 2;
      }

      .side-button {
        width: 28px;
        height: 28px;
        display: block;
        position: relative;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.015);
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.01);
        overflow: hidden;
        text-decoration: none;
      }

      .side-button::before {
        content: "";
        position: absolute;
        inset: 5px;
        border-radius: 5px;
        border: 1px dashed rgba(255, 255, 255, 0.15);
        background: rgba(255,255,255,0.015);
      }

      .side-button.has-image::before {
        display: none;
      }

      .side-button.controller-icon::before {
        display: none;
      }

      .side-button.app-icon::before {
        display: none;
      }

      .side-button.controller-icon {
        border-color: rgba(255, 255, 255, 0.12);
        background: linear-gradient(145deg, #20252a, #101316 72%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 2px 7px rgba(0, 0, 0, 0.35);
      }

      .side-button.controller-icon:hover {
        border-color: rgba(255, 255, 255, 0.24);
        background: linear-gradient(145deg, #292f35, #15191d 72%);
      }

      .side-button.app-icon {
        border-color: rgba(255, 255, 255, 0.12);
        background: linear-gradient(145deg, #20252a, #101316 72%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.08),
          0 2px 7px rgba(0, 0, 0, 0.35);
      }

      .side-button.app-icon:hover {
        border-color: rgba(255, 255, 255, 0.24);
        background: linear-gradient(145deg, #292f35, #15191d 72%);
      }

      .side-button.settings-icon {
        border-color: rgba(190, 196, 211, 0.15);
        background:
          radial-gradient(circle at 50% 42%, rgba(190, 196, 211, 0.11), transparent 68%),
          linear-gradient(145deg, #202329, #101216 76%);
      }

      .side-button.settings-icon:hover,
      .side-button.settings-icon:focus-visible {
        border-color: rgba(213, 218, 231, 0.34);
        background:
          radial-gradient(circle at 50% 42%, rgba(205, 211, 226, 0.17), transparent 68%),
          linear-gradient(145deg, #292d35, #15171d 76%);
      }

      .settings-icon svg {
        fill: none;
        stroke: #d9dce5;
        stroke-width: 1.45;
        transition: transform 180ms ease, stroke 180ms ease;
      }

      .side-button.movie-icon {
        border-color: rgba(198, 190, 220, 0.18);
        background:
          radial-gradient(circle at 50% 38%, rgba(179, 157, 224, 0.15), transparent 70%),
          linear-gradient(145deg, #24212d, #101116 76%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.09),
          0 2px 8px rgba(0, 0, 0, 0.4);
      }

      .side-button.movie-icon:hover,
      .side-button.movie-icon:focus-visible {
        border-color: rgba(210, 194, 239, 0.42);
        background:
          radial-gradient(circle at 50% 38%, rgba(194, 169, 239, 0.24), transparent 70%),
          linear-gradient(145deg, #302a3a, #15151c 76%);
      }

      .movie-icon svg {
        fill: rgba(196, 179, 229, 0.1);
        stroke: #ded3f2;
        stroke-width: 1.35;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: transform 180ms ease, stroke 180ms ease;
      }

      .movie-icon svg .movie-play {
        fill: #ded3f2;
        stroke: none;
      }

      .movie-icon:hover svg,
      .movie-icon:focus-visible svg {
        transform: scale(1.06);
        stroke: #f2eaff;
      }

      .settings-icon:hover svg,
      .settings-icon:focus-visible svg {
        transform: rotate(24deg);
        stroke: #f2f3f7;
      }

      .controller-icon svg,
      .app-icon svg {
        position: absolute;
        inset: 2px;
        width: 22px;
        height: 22px;
        fill: rgba(226, 231, 236, 0.12);
        stroke: #e2e7ec;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.35;
      }

      .app-icon svg {
        fill: none;
      }

      .controller-icon svg .button-dot {
        fill: #e2e7ec;
        stroke: none;
      }

      .side-icon {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .tab-button {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        flex: 0 0 28px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        color: rgba(255, 255, 255, 0.72);
        font: 11px "Segoe UI", sans-serif;
      }

      .tab-button.active {
        background: rgba(255, 255, 255, 0.09);
        border-color: rgba(255, 255, 255, 0.2);
        color: rgba(255, 255, 255, 0.96);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.025);
      }

      .tab-button:hover {
        border-color: rgba(255, 255, 255, 0.18);
        color: rgba(255, 255, 255, 0.95);
      }

      .horizontal-tabs {
        position: absolute;
        top: 44px;
        left: 48px;
        right: 0;
        height: 32px;
        display: none;
        align-items: center;
        gap: 6px;
        padding: 0 10px;
        border-bottom: 1px solid rgba(255,255,255,.04);
        background: rgba(7,9,11,.97);
        z-index: 9;
      }

      .horizontal-tabs .tab-button {
        width: auto;
        min-width: 42px;
        height: 24px;
        flex: 0 0 auto;
        padding: 0 10px;
      }

      .browser.layout-horizontal .horizontal-tabs,
      .browser.layout-both .horizontal-tabs {
        display: flex;
      }

      .browser.layout-horizontal #tabButtons {
        display: none;
      }

      .browser.layout-horizontal .page,
      .browser.layout-horizontal .math-view,
      .browser.layout-horizontal .apps-view,
      .browser.layout-horizontal .settings-view,
      .browser.layout-horizontal .movie-view,
      .browser.layout-horizontal .proxy-view,
      .browser.layout-both .page,
      .browser.layout-both .math-view,
      .browser.layout-both .apps-view,
      .browser.layout-both .settings-view,
      .browser.layout-both .movie-view,
      .browser.layout-both .proxy-view {
        top: 76px;
      }

      #tabButtons {
        display: contents;
      }

      .new-tab-button {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        position: relative;
        flex: 0 0 28px;
        border-radius: 8px;
        border: 1px solid transparent;
        color: rgba(255, 255, 255, 0.62);
        background: transparent;
        padding: 0;
      }

      .new-tab-button::before,
      .new-tab-button::after {
        content: "";
        position: absolute;
        width: 12px;
        height: 1px;
        border-radius: 1px;
        background: currentColor;
      }

      .new-tab-button::after {
        transform: rotate(90deg);
      }

      .new-tab-button:hover {
        color: rgba(255, 255, 255, 0.95);
        background: rgba(255, 255, 255, 0.04);
        border-color: rgba(255, 255, 255, 0.08);
      }

      .sidebar .spacer {
        flex: 1;
      }

      .sidebar-divider {
        width: 26px;
        height: 1px;
        flex: 0 0 1px;
        margin: 0;
        background: rgba(255, 255, 255, 0.12);
      }

      .page {
        position: absolute;
        inset: 44px 0 28px 48px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      .page.is-hidden {
        display: none;
      }

      .math-view {
        position: absolute;
        inset: 44px 0 28px 48px;
        z-index: 1;
        background: #090a0a;
      }

      .apps-view {
        position: absolute;
        inset: 44px 0 28px 48px;
        z-index: 1;
        background: #090a0a;
      }

      .settings-view {
        position: absolute;
        inset: 44px 0 28px 48px;
        z-index: 1;
        background: #090a0a;
      }

      .movie-view {
        position: absolute;
        inset: 44px 0 28px 48px;
        z-index: 1;
        background: #090a0a;
      }

      .math-view[hidden],
      .apps-view[hidden],
      .settings-view[hidden],
      .movie-view[hidden] {
        display: none;
      }

      .math-view iframe,
      .apps-view iframe,
      .settings-view iframe,
      .movie-view iframe,
      .proxy-view iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      .proxy-view {
        position: absolute;
        inset: 44px 0 28px 48px;
        z-index: 1;
        background: #080909;
      }

      .proxy-view[hidden] {
        display: none;
      }

      .proxy-error {
        position: absolute;
        top: 18px;
        left: 50%;
        width: min(560px, calc(100% - 32px));
        z-index: 12;
        transform: translateX(-50%);
        padding: 12px 16px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        background: rgba(12, 14, 16, 0.96);
        color: #e6d5d5;
        font-size: 13px;
        line-height: 1.5;
      }

      .proxy-error[hidden] {
        display: none;
      }

      .brand {
        margin-bottom: 22px;
        font-family: "Segoe Print", "Bradley Hand", cursive;
        font-size: clamp(3.1rem, 3.2vw, 5rem);
        line-height: 1;
        font-weight: 500;
        letter-spacing: -0.06em;
        color: rgba(255,255,255,0.9);
        text-shadow: 0 0 16px rgba(255,255,255,0.06);
        transform: rotate(-2deg);
        text-transform: lowercase;
      }

      .search-box {
        width: min(530px, 42vw);
        margin: 0;
        height: 54px;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 0 0 1px rgba(255,255,255,0.08), inset 0 0 0 1px rgba(255,255,255,0.08), 0 0 18px rgba(255,255,255,0.02);
        display: flex;
        align-items: center;
        padding: 0 18px;
      }

      .search-icon {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255,255,255,0.7);
        border-radius: 50%;
        position: relative;
        margin-right: 14px;
        opacity: 0.9;
      }

      .search-icon::after {
        content: "";
        position: absolute;
        width: 7px;
        height: 2px;
        background: rgba(255,255,255,0.7);
        border-radius: 4px;
        transform: rotate(45deg);
        right: -5px;
        bottom: -1px;
      }

      .search-box input {
        flex: 1;
        background: transparent;
        border: none;
        color: rgba(255,255,255,0.92);
        font-size: 15px;
        outline: none;
        caret-color: #fff;
        cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="24" viewBox="0 0 16 24"><path d="M8 2v20M4 2h8M4 22h8" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>') 8 12, text;
      }

      .search-box input::placeholder {
        color: rgba(255,255,255,0.5);
      }

      .browser.search-edge-glow .search-box {
        animation: search-edge-glow 2.6s ease-in-out infinite alternate;
      }

      @keyframes search-edge-glow {
        from { box-shadow: 0 0 0 1px rgba(255,255,255,.08), inset 0 0 0 1px rgba(255,255,255,.08), 0 0 12px rgba(122,221,126,.08); }
        to { box-shadow: 0 0 0 1px rgba(122,221,126,.36), inset 0 0 0 1px rgba(122,221,126,.2), 0 0 24px rgba(122,221,126,.22); }
      }

      .browser.low-power-backdrop *,
      .browser.low-power-backdrop *::before,
      .browser.low-power-backdrop *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }

      .browser.home-no-tabs #tabButtons {
        display: none;
      }

      .browser.game-focus .window-header,
      .browser.game-focus .sidebar,
      .browser.game-focus .bottom-bar {
        opacity: 0.22;
        transition: opacity 180ms ease;
      }

      .browser.game-focus .window-header:hover,
      .browser.game-focus .sidebar:hover,
      .browser.game-focus .bottom-bar:hover {
        opacity: 1;
      }

      .quick-relaunch {
        margin-top: 14px;
        padding: 8px 12px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 999px;
        background: rgba(255,255,255,.035);
        color: rgba(255,255,255,.72);
        font: 12px "Segoe UI", sans-serif;
      }

      .install-app-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        padding: 9px 14px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.045);
        color: rgba(240, 241, 242, 0.84);
        font: 12px "Segoe UI", sans-serif;
        transition: background 150ms ease, border-color 150ms ease, color 150ms ease;
      }

      .install-app-button:hover {
        border-color: rgba(255, 255, 255, 0.28);
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
      }

      .install-app-button[hidden] {
        display: none;
      }

      .quick-relaunch:hover {
        border-color: rgba(255,255,255,.24);
        color: #fff;
      }

      .performance-overlay {
        position: absolute;
        right: 12px;
        bottom: 34px;
        z-index: 9;
        padding: 5px 8px;
        border: 1px solid rgba(255,255,255,.1);
        border-radius: 7px;
        background: rgba(8,10,11,.88);
        color: rgba(255,255,255,.75);
        font: 10px "Segoe UI", sans-serif;
        pointer-events: none;
      }

      .performance-overlay[hidden] {
        display: none;
      }

      .tutorial-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        padding: 20px;
        background: rgba(0, 0, 0, 0.72);
        backdrop-filter: blur(8px);
      }

      .tutorial-overlay[hidden] {
        display: none;
      }

      .tutorial-dialog {
        width: min(460px, 100%);
        padding: 26px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 18px;
        background:
          radial-gradient(circle at 100% 0, rgba(190, 196, 211, 0.08), transparent 45%),
          #101214;
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.58);
      }

      .tutorial-meta,
      .tutorial-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .tutorial-eyebrow,
      .tutorial-step-count {
        color: rgba(230, 233, 239, 0.55);
        font-size: 10px;
        font-weight: 650;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .tutorial-dialog h1 {
        margin: 24px 0 9px;
        color: #f1f2f4;
        font-size: 23px;
        font-weight: 550;
        letter-spacing: -0.025em;
      }

      .tutorial-dialog p {
        min-height: 48px;
        margin: 0;
        color: rgba(229, 232, 237, 0.68);
        font-size: 14px;
        line-height: 1.65;
      }

      .tutorial-progress {
        height: 3px;
        margin: 22px 0;
        overflow: hidden;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.09);
      }

      .tutorial-progress span {
        display: block;
        width: 25%;
        height: 100%;
        border-radius: inherit;
        background: #d9dce5;
        transition: width 180ms ease;
      }

      .tutorial-error {
        min-height: 0 !important;
        margin: -8px 0 16px !important;
        color: #f0aaaa !important;
        font-size: 12px !important;
      }

      .tutorial-error[hidden] {
        display: none;
      }

      .tutorial-actions button {
        min-height: 36px;
        padding: 0 13px;
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.045);
        color: rgba(241, 242, 244, 0.78);
        font: 12px "Segoe UI", sans-serif;
      }

      .tutorial-actions button:hover:not(:disabled) {

    <script>
      document.querySelectorAll('.side-button[data-image]').forEach((button) => {
        const imageUrl = button.dataset.image.trim();
        if (!imageUrl) {
          return;
        }

        const image = document.createElement('img');
        image.className = 'side-icon';
        image.alt = '';
        image.src = imageUrl;
        image.addEventListener('error', () => {
          image.remove();
          button.classList.remove('has-image');
        });
        button.classList.add('has-image');
        button.appendChild(image);
      });

      const tabs = [{ id: 1, searchValue: '' }];
      let activeTabId = 1;
      let nextTabId = 2;
      const searchInput = document.querySelector('.search-box input');
      const tabButtons = document.getElementById('tabButtons');
      const tabCount = document.getElementById('tabCount');
      const horizontalTabs = document.getElementById('horizontalTabs');
      const homePage = document.querySelector('.page');
      const browser = document.querySelector('.browser');
      const particleCanvas = document.getElementById('backgroundParticles');
      const particleContext = particleCanvas.getContext('2d');
      const reducedMotionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      const particles = [];
      let particleAnimationFrame = 0;
      let particleWidth = 0;
      let particleHeight = 0;

      function resizeParticleCanvas() {
        const pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
        particleWidth = browser.clientWidth;
        particleHeight = browser.clientHeight;
        particleCanvas.width = Math.round(particleWidth * pixelRatio);
        particleCanvas.height = Math.round(particleHeight * pixelRatio);
        particleCanvas.style.width = particleWidth + 'px';
        particleCanvas.style.height = particleHeight + 'px';
        particleContext.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

        const particleCount = Math.min(80, Math.ceil((particleWidth * particleHeight) / 18000));
        particles.length = 0;
        for (let index = 0; index < particleCount; index += 1) {
          particles.push({
            x: Math.random() * particleWidth,
            y: Math.random() * particleHeight,
            radius: 0.6 + Math.random() * 1.2,
            speed: 0.12 + Math.random() * 0.35,
            drift: (Math.random() - 0.5) * 0.18,
            opacity: 0.12 + Math.random() * 0.24
          });
        }
      }

      function drawBackgroundParticles() {
        particleAnimationFrame = 0;
        if (document.hidden || reducedMotionQuery.matches || browser.classList.contains('low-power-backdrop')) return;

        particleContext.clearRect(0, 0, particleWidth, particleHeight);
        for (const particle of particles) {
          particleContext.beginPath();
          particleContext.fillStyle = 'rgba(220, 226, 235, ' + particle.opacity + ')';
          particleContext.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
          particleContext.fill();
          particle.y += particle.speed;
          particle.x += particle.drift;
          if (particle.y > particleHeight + particle.radius) {
            particle.y = -particle.radius;
            particle.x = Math.random() * particleWidth;
          }
          if (particle.x < -particle.radius) particle.x = particleWidth + particle.radius;
          if (particle.x > particleWidth + particle.radius) particle.x = -particle.radius;
        }

        particleAnimationFrame = window.requestAnimationFrame(drawBackgroundParticles);
      }

      function updateBackgroundParticles() {
        if (document.hidden || reducedMotionQuery.matches || browser.classList.contains('low-power-backdrop')) {
          if (particleAnimationFrame) window.cancelAnimationFrame(particleAnimationFrame);
          particleAnimationFrame = 0;
          return;
        }
        if (!particleAnimationFrame) particleAnimationFrame = window.requestAnimationFrame(drawBackgroundParticles);
      }

      resizeParticleCanvas();
      updateBackgroundParticles();
      window.addEventListener('resize', resizeParticleCanvas);
      window.addEventListener('resize', updateBackgroundParticles);
      document.addEventListener('visibilitychange', updateBackgroundParticles);
      reducedMotionQuery.addEventListener('change', updateBackgroundParticles);

      const mathView = document.getElementById('mathView');
      const mathFrame = document.getElementById('mathFrame');
      const appsView = document.getElementById('appsView');
      const appsFrame = document.getElementById('appsFrame');
      const settingsView = document.getElementById('settingsView');
      const settingsFrame = document.getElementById('settingsFrame');
      const movieView = document.getElementById('movieView');
      const movieFrame = document.getElementById('movieFrame');
      const proxyView = document.getElementById('proxyView');
      const proxyFrame = document.getElementById('proxyFrame');
      const proxyError = document.getElementById('proxyError');
      const addressText = document.getElementById('addressText');
      const performanceOverlay = document.getElementById('performanceOverlay');
      const proxySearchForm = document.getElementById('proxySearchForm');
      const proxySearchInput = document.getElementById('proxySearchInput');
      const quickRelaunchButton = document.getElementById('quickRelaunchButton');
      const tutorialOverlay = document.getElementById('tutorialOverlay');
      const tutorialDialog = document.getElementById('tutorialDialog');
      const tutorialTitle = document.getElementById('tutorialTitle');
      const tutorialDescription = document.getElementById('tutorialDescription');
      const tutorialStepCount = document.getElementById('tutorialStepCount');
      const tutorialProgress = document.getElementById('tutorialProgress');
      const tutorialError = document.getElementById('tutorialError');
      const tutorialSkip = document.getElementById('tutorialSkip');
      const tutorialBack = document.getElementById('tutorialBack');
      const tutorialNext = document.getElementById('tutorialNext');
      const tutorialStorageKey = 'lucent.tutorial.completed';
      const tutorialSteps = [
        {
          title: 'A calmer new tab',
          description: 'This is your Lucent home screen. Use the search box to search the web or enter a website address.'
        },
        {
          title: 'Search and browse',
          description: 'Lucent opens supported pages in its built-in proxy view. Enter a search or address in the search box to get started.'
        },
        {
          title: 'Your sidebar',
          description: 'Use the sidebar to return home or open Games, Apps, Settings, and Movies without leaving the Lucent page.'
        },
        {
          title: 'Make it yours',
          description: 'Open Settings to adjust Lucent’s appearance and behavior. You can change these options later, whenever you like.'
        }
      ];
      let tutorialStep = 0;
      const settingsStorageKey = 'lucent.settings';
      const settingsDefaults = {
        disguise: 'none', exitWarning: false, homeNoTabs: false,
        searchEdgeGlow: false, perfOverlay: false, lowPowerBackdrop: false, relay: 'west',
        searchEngine: 'duckduckgo', stripTracking: false, preferHttps: false,
        shortcuts: { newTab: 'Ctrl+T', closeTab: 'Ctrl+W', focusAddress: 'Ctrl+L', games: 'Ctrl+G' }
      };
      let appSettings = loadAppSettings();
      let performanceLoopRunning = false;
      let performanceUpdateTimer = null;
      let frameCount = 0;
      let lastFrameTime = performance.now();
      const connection = window.BareMux
        ? new BareMux.BareMuxConnection('/baremux/worker.js')
        : null;

      function renderTutorialStep() {
        const step = tutorialSteps[tutorialStep];
        tutorialTitle.textContent = step.title;
        tutorialDescription.textContent = step.description;
        tutorialStepCount.textContent = (tutorialStep + 1) + ' of ' + tutorialSteps.length;
        tutorialProgress.style.width = ((tutorialStep + 1) / tutorialSteps.length * 100) + '%';
        tutorialBack.disabled = tutorialStep === 0;
        tutorialNext.textContent = tutorialStep === tutorialSteps.length - 1 ? 'Finish' : 'Next';
        tutorialError.hidden = true;
        tutorialError.textContent = '';
      }

      function completeTutorial() {
        try {
          localStorage.setItem(tutorialStorageKey, 'complete');
        } catch (error) {
          console.error('Unable to save Lucent tutorial completion.', error);
          tutorialError.textContent = 'Lucent could not save this on your device. Allow site storage, then try again.';
          tutorialError.hidden = false;
          return;
        }
        tutorialOverlay.hidden = true;
      }

      function initializeTutorial() {
        try {
          if (localStorage.getItem(tutorialStorageKey) === 'complete') return;
        } catch (error) {
          console.error('Unable to check Lucent tutorial status.', error);
        }
        renderTutorialStep();
        tutorialOverlay.hidden = false;
        tutorialSkip.focus();
      }

      tutorialBack.addEventListener('click', () => {
        if (tutorialStep === 0) return;
        tutorialStep -= 1;
        renderTutorialStep();
      });

      tutorialNext.addEventListener('click', () => {
        if (tutorialStep === tutorialSteps.length - 1) {
          completeTutorial();
          return;
        }
        tutorialStep += 1;
        renderTutorialStep();
      });

      tutorialSkip.addEventListener('click', completeTutorial);

      tutorialDialog.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') {
          event.preventDefault();
          return;
        }
        if (event.key === 'Tab') {
          const focusable = [tutorialSkip, tutorialBack, tutorialNext].filter((button) => !button.disabled);
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first.focus();
          }
        }
      });

      initializeTutorial();

      function loadAppSettings() {
        try {
          const stored = JSON.parse(localStorage.getItem(settingsStorageKey) || '{}');
          return {
            ...settingsDefaults,
            ...stored,
            shortcuts: { ...settingsDefaults.shortcuts, ...(stored.shortcuts || {}) }
          };
        } catch (error) {
          console.error('Unable to read saved Lucent settings.', error);
          return { ...settingsDefaults, shortcuts: { ...settingsDefaults.shortcuts } };
        }
      }

      function applyAppSettings() {
        const disguises = {
          none: 'lucent',
          classroom: 'Classes',
          drive: 'My Drive - Google Drive',
          canvas: 'Dashboard',
          wikipedia: 'Wikipedia'
        };
        document.title = disguises[appSettings.disguise] || 'lucent';
        document.getElementById('appFavicon').href = '/logo.jpg';
        browser.classList.toggle('search-edge-glow', Boolean(appSettings.searchEdgeGlow));
        browser.classList.toggle('low-power-backdrop', Boolean(appSettings.lowPowerBackdrop));
        updateBackgroundParticles();
        browser.classList.toggle('home-no-tabs', Boolean(appSettings.homeNoTabs));
        browser.classList.toggle('game-focus', Boolean(appSettings.gameFocusMode && !mathView.hidden));
        browser.classList.toggle('layout-horizontal', appSettings.layout === 'horizontal');
        browser.classList.toggle('layout-both', appSettings.layout === 'both');
        performanceOverlay.hidden = !appSettings.perfOverlay;
        if (appSettings.perfOverlay) startPerformanceOverlay();
        try {
          const lastGame = localStorage.getItem('lucent.lastPlayed');
          quickRelaunchButton.hidden = !appSettings.quickRelaunch || !lastGame;
          if (lastGame) quickRelaunchButton.textContent = 'Play again · ' + lastGame;
        } catch (error) {
          console.error('Unable to read the last played game.', error);
          quickRelaunchButton.hidden = true;
        }
        if (appSettings.disguise && appSettings.disguise !== 'none') {
          addressText.textContent = {
            classroom: 'classroom.google.com',
            drive: 'drive.google.com',
            canvas: 'canvas.instructure.com',
            wikipedia: 'wikipedia.org'
          }[appSettings.disguise];
        } else if (!mathView.hidden) {
          addressText.textContent = 'lucent://games';
        } else if (!appsView.hidden) {
          addressText.textContent = 'lucent://apps';
        } else if (!settingsView.hidden) {
          addressText.textContent = 'lucent://settings';
        } else if (!movieView.hidden) {
          addressText.textContent = 'lucent://movies';
        } else if (!proxyView.hidden) {
          addressText.textContent = proxyFrame.dataset.targetUrl || 'lucent://proxy';
        } else {
          addressText.textContent = 'lucent://newtab';
        }
      }

      applyAppSettings();

      if (appSettings.autocloak && window.top === window) {
        const blankWindow = window.open('about:blank', '_blank');
        if (blankWindow) {
          blankWindow.document.title = ' ';
          blankWindow.document.body.style.cssText = 'margin:0;overflow:hidden;background:#020303';
          const frame = blankWindow.document.createElement('iframe');
          frame.src = window.location.href;
          frame.title = 'Lucent';
          frame.allow = 'autoplay; fullscreen; gamepad; clipboard-read; clipboard-write';
          frame.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0';
          blankWindow.document.body.appendChild(frame);
        } else {
          console.warn('Autocloak could not open a new tab because the browser blocked the pop-up.');
        }
      }

      function showHome() {
        mathView.hidden = true;
        appsView.hidden = true;
        settingsView.hidden = true;
        movieView.hidden = true;
        proxyView.hidden = true;
        proxyError.hidden = true;
        homePage.classList.remove('is-hidden');
        addressText.textContent = 'lucent://newtab';
        applyAppSettings();
      }

      function showMath(gameName) {
        appsView.hidden = true;
        settingsView.hidden = true;
        movieView.hidden = true;
        proxyView.hidden = true;
        proxyError.hidden = true;
        homePage.classList.add('is-hidden');
        mathView.hidden = false;
        addressText.textContent = 'lucent://games';
        if (!mathFrame.src) {
          mathFrame.src = 'math/index.html';
        }
        if (gameName) {
          mathFrame.src = 'math/iframe.html?game=' + encodeURIComponent(gameName);
        }
        applyAppSettings();
      }

      function showApps() {
        mathView.hidden = true;
        settingsView.hidden = true;
        movieView.hidden = true;
        proxyView.hidden = true;
        proxyError.hidden = true;
        homePage.classList.add('is-hidden');
        appsView.hidden = false;
        addressText.textContent = 'lucent://apps';
        if (!appsFrame.src) {
          appsFrame.src = 'apps.html';
        }
        applyAppSettings();
      }

      function showSettings() {
        mathView.hidden = true;
        appsView.hidden = true;
        movieView.hidden = true;
        proxyView.hidden = true;
        proxyError.hidden = true;
        homePage.classList.add('is-hidden');
        settingsView.hidden = false;
        addressText.textContent = 'lucent://settings';
        if (!settingsFrame.src) {
          settingsFrame.src = 'settings.html';
        }
        applyAppSettings();
      }

      function showMovies() {
        mathView.hidden = true;
        appsView.hidden = true;
        settingsView.hidden = true;
        movieView.hidden = false;
        proxyView.hidden = true;
        proxyError.hidden = true;
        homePage.classList.add('is-hidden');
        addressText.textContent = 'lucent://movies';
        if (!movieFrame.src) {
          movieFrame.src = '/algebra.html?url=https://movy.sx';
        }
        applyAppSettings();
      }

      function showProxy(targetUrl) {
        homePage.classList.add('is-hidden');
        mathView.hidden = true;
        appsView.hidden = true;
        settingsView.hidden = true;
        movieView.hidden = true;
        proxyView.hidden = false;
        proxyError.hidden = true;
        addressText.textContent = targetUrl;
        proxyFrame.dataset.targetUrl = targetUrl;
        applyAppSettings();
      }

      proxySearchForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        const input = proxySearchInput.value.trim();
        if (!input) {
          proxySearchInput.focus();
          return;
        }

        if (!window.__uv$config || typeof window.search !== 'function' || !connection) {
          proxyError.textContent = 'The proxy is not available. Make sure the Ultraviolet proxy routes are running on this site.';
          proxyError.hidden = false;
          return;
        }

        try {
          let query = input;
          if (appSettings.preferHttps) {
            query = query.replace(/^http:\/\//i, 'https://');
          }
          if (appSettings.stripTracking) {
            try {
              const parsed = new URL(query);
              [...parsed.searchParams.keys()].forEach((key) => {
                if (/^utm_/i.test(key) || /^(gclid|fbclid|msclkid)$/i.test(key)) {
                  parsed.searchParams.delete(key);
                }
              });
              query = parsed.href;
            } catch (error) {
              if (!(error instanceof TypeError)) throw error;
            }
          }
          const searchTemplates = {
            duckduckgo: 'https://duckduckgo.com/?q=%s',
            google: 'https://www.google.com/search?q=%s',
            bing: 'https://www.bing.com/search?q=%s',
            brave: 'https://search.brave.com/search?q=%s'
          };
          const targetUrl = window.search(query, searchTemplates[appSettings.searchEngine] || searchTemplates.duckduckgo);
          await window.registerSW();

          const wispUrl =
            (location.protocol === 'https:' ? 'wss' : 'ws') +
            '://' +
            location.host +
            '/wisp/';
          await connection.setTransport('/epoxy/index.mjs', [{ wisp: wispUrl }]);

          showProxy(targetUrl);
          proxyFrame.src =
            window.__uv$config.prefix +
            window.__uv$config.encodeUrl(targetUrl);
        } catch (error) {
          console.error('Unable to load the requested page through Ultraviolet.', error);
          homePage.classList.remove('is-hidden');
          proxyView.hidden = true;
          proxyError.textContent = 'Could not start the proxy. Check that it is served securely and that its routes are available.';
          proxyError.hidden = false;
        }
      });

      document.getElementById('homeButton').addEventListener('click', (event) => {
        event.preventDefault();
        showHome();
      });

      document.getElementById('gamesButton').addEventListener('click', (event) => {
        event.preventDefault();
        showMath();
      });

      document.getElementById('appsButton').addEventListener('click', (event) => {
        event.preventDefault();
        showApps();
      });

      document.getElementById('settingsButton').addEventListener('click', (event) => {
        event.preventDefault();
        showSettings();
      });

      document.getElementById('moviesButton').addEventListener('click', (event) => {
        event.preventDefault();
        showMovies();
      });

      quickRelaunchButton.addEventListener('click', () => {
        const lastGame = localStorage.getItem('lucent.lastPlayed');
        if (lastGame) showMath(lastGame);
      });

      document.addEventListener('contextmenu', (event) => {
        event.preventDefault();
      });

      let pendingInstallPrompt = null;
      const installAppButton = document.getElementById('installAppButton');

      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        pendingInstallPrompt = event;
        installAppButton.hidden = false;
      });

      installAppButton.addEventListener('click', async () => {
        if (!pendingInstallPrompt) return;

        const installPrompt = pendingInstallPrompt;
        pendingInstallPrompt = null;
        installAppButton.disabled = true;
        try {
          await installPrompt.prompt();
          await installPrompt.userChoice;
        } catch (error) {
          console.error('Unable to show the Lucent install prompt.', error);
        } finally {
          installAppButton.hidden = true;
          installAppButton.disabled = false;
        }
      });

      window.addEventListener('appinstalled', () => {
        pendingInstallPrompt = null;
        installAppButton.hidden = true;
      });

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/pwa-sw.js')
          .catch((error) => console.error('Unable to register the Lucent app service worker.', error));
      }

      window.addEventListener('beforeunload', (event) => {
        if (appSettings.exitWarning) {
          event.preventDefault();
          event.returnValue = '';
        }
      });

      window.addEventListener('message', (event) => {
        if (event.source === settingsFrame.contentWindow && event.data && event.data.type === 'lucent:settings-updated') {
          appSettings = loadAppSettings();
          applyAppSettings();
        }
        if (event.source === mathFrame.contentWindow && event.data && event.data.type === 'lucent:game-open' && typeof event.data.name === 'string') {
          try {
            if (appSettings.quickRelaunch) {
              localStorage.setItem('lucent.lastPlayed', event.data.name);
            }
            if (appSettings.recentPlays) {
              const previous = JSON.parse(localStorage.getItem('lucent.recentPlays') || '[]');
              const recent = Array.isArray(previous) ? previous.filter((name) => name !== event.data.name) : [];
              recent.unshift(event.data.name);
              localStorage.setItem('lucent.recentPlays', JSON.stringify(recent.slice(0, 20)));
            }
            applyAppSettings();
          } catch (error) {
            console.error('Unable to save game activity.', error);
          }
        }
      });

      window.addEventListener('message', (event) => {
        if (event.source === mathFrame.contentWindow && event.data === 'lucent:show-home') {
          showHome();
        }
        if (event.source === appsFrame.contentWindow && event.data === 'lucent:show-home') {
          showHome();
        }
        if (event.source === settingsFrame.contentWindow && event.data === 'lucent:show-home') {
          showHome();
        }
      });

      function normalizeShortcut(value) {
        return value.split('+').map((part) => part.trim().toLowerCase()).filter(Boolean);
      }

      function matchesShortcut(event, configured) {
        const parts = normalizeShortcut(configured);
        const key = parts[parts.length - 1];
        const ctrl = parts.includes('ctrl');
        const alt = parts.includes('alt');
        const shift = parts.includes('shift');
        const meta = parts.includes('meta');
        return event.key.toLowerCase() === key &&
          event.ctrlKey === ctrl && event.altKey === alt &&
          event.shiftKey === shift && event.metaKey === meta;
      }

      window.addEventListener('keydown', (event) => {
        if (
          event.key === 'F12' ||
          (event.ctrlKey && event.shiftKey && ['i', 'j', 'c'].includes(event.key.toLowerCase())) ||
          (event.ctrlKey && event.key.toLowerCase() === 'u')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return;
        }
        if (event.target instanceof HTMLInputElement || event.target instanceof HTMLTextAreaElement || event.target instanceof HTMLSelectElement || event.isComposing) {
          return;
        }
        if (matchesShortcut(event, appSettings.shortcuts.focusAddress || 'Ctrl+L')) {
          event.preventDefault();
          proxySearchInput.focus();
        } else if (matchesShortcut(event, appSettings.shortcuts.games || 'Ctrl+G')) {
          event.preventDefault();
          showMath();
        } else if (matchesShortcut(event, appSettings.shortcuts.newTab || 'Ctrl+T')) {
          event.preventDefault();
          document.getElementById('newTabButton').click();
        } else if (matchesShortcut(event, appSettings.shortcuts.closeTab || 'Ctrl+W')) {
          event.preventDefault();
          const activeTab = tabs.find((tab) => tab.id === activeTabId);
          const activeButton = tabButtons.querySelector('.tab-button.active');
          if (activeTab && activeButton) {
            const index = tabs.indexOf(activeTab);
            tabs.splice(index, 1);
            activeButton.remove();
            if (tabs.length) {
              const nextTab = tabs[Math.max(0, index - 1)];
              switchTab(nextTab.id);
            } else {
              activeTabId = 0;
              proxySearchInput.value = '';
              showHome();
            }
            updateTabCount();
            refreshHorizontalTabs();
          }
        }
      });

      function updateTabCount() {
        tabCount.textContent = tabs.length + (tabs.length === 1 ? ' tab' : ' tabs');
      }

      function switchTab(tabId) {
        const activeTab = tabs.find((tab) => tab.id === activeTabId);
        if (activeTab) {
          activeTab.searchValue = searchInput.value;
        }

        const nextTab = tabs.find((tab) => tab.id === tabId);
        if (!nextTab) {
          return;
        }

        activeTabId = tabId;
        searchInput.value = nextTab.searchValue;
        tabButtons.querySelectorAll('.tab-button').forEach((button) => {
          const isActive = Number(button.dataset.tabId) === activeTabId;
          button.classList.toggle('active', isActive);
          button.setAttribute('aria-pressed', String(isActive));
        });
        horizontalTabs.querySelectorAll('.tab-button').forEach((button) => {
          const isActive = Number(button.dataset.tabId) === activeTabId;
          button.classList.toggle('active', isActive);
          button.setAttribute('aria-pressed', String(isActive));
        });
      }

      function refreshHorizontalTabs() {
        horizontalTabs.replaceChildren();
        tabs.forEach((tab) => {
          const button = document.createElement('button');
          button.className = 'tab-button' + (tab.id === activeTabId ? ' active' : '');
          button.type = 'button';
          button.textContent = 'L';
          button.dataset.tabId = String(tab.id);
          button.setAttribute('aria-label', 'tab ' + tab.id);
          button.setAttribute('aria-pressed', String(tab.id === activeTabId));
          button.addEventListener('click', () => switchTab(tab.id));
          horizontalTabs.appendChild(button);
        });
      }

      document.getElementById('newTabButton').addEventListener('click', () => {
        const activeTab = tabs.find((tab) => tab.id === activeTabId);
        if (activeTab) {
          activeTab.searchValue = searchInput.value;
        }

        const newTab = { id: nextTabId, searchValue: '' };
        tabs.push(newTab);
        const tabButton = document.createElement('button');
        tabButton.className = 'tab-button';
        tabButton.type = 'button';
        tabButton.textContent = 'L';
        tabButton.dataset.tabId = String(newTab.id);
        tabButton.setAttribute('aria-label', 'tab ' + newTab.id);
        tabButton.addEventListener('click', () => switchTab(newTab.id));
        tabButtons.appendChild(tabButton);
        nextTabId += 1;
        updateTabCount();
        switchTab(newTab.id);
        refreshHorizontalTabs();
      });

      tabButtons.querySelectorAll('.tab-button').forEach((button) => {
        button.dataset.tabId = '1';
        button.addEventListener('click', () => switchTab(1));
      });
      refreshHorizontalTabs();

      function updateTime() {
        const now = new Date();
        const time = now.toLocaleTimeString([], {
          hour: '2-digit',
          minute: '2-digit'
        });

        const timeEl = document.getElementById('timeDisplay');
        if (timeEl) {
          timeEl.textContent = '⏱ ' + time.toLowerCase();
        }
      }

      updateTime();
      setInterval(updateTime, 30000);

      function updatePerformanceOverlay() {
        if (!appSettings.perfOverlay) {
          performanceLoopRunning = false;
          window.clearInterval(performanceUpdateTimer);
          performanceUpdateTimer = null;
          return;
        }
        const now = performance.now();
        const elapsed = now - lastFrameTime;
        const fps = frameCount ? Math.round(frameCount * 1000 / elapsed) + ' FPS' : 'FPS unavailable';
        const memory = performance.memory
          ? ' · ' + Math.round(performance.memory.usedJSHeapSize / 1048576) + ' MB'
          : '';
        performanceOverlay.textContent = fps + memory;
        frameCount = 0;
        lastFrameTime = now;
      }

      function countPerformanceFrame() {
        if (!performanceLoopRunning || !appSettings.perfOverlay) return;
        frameCount += 1;
        requestAnimationFrame(countPerformanceFrame);
      }

      function startPerformanceOverlay() {
        if (performanceLoopRunning) return;
        performanceLoopRunning = true;
        frameCount = 0;
        lastFrameTime = performance.now();
        countPerformanceFrame();
        performanceUpdateTimer = window.setInterval(updatePerformanceOverlay, 1000);
      }
    </script>
  </body>
</html>
