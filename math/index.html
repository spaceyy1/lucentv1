<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>math | catalogue</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", sans-serif;
        background: #080909;
        color: #eee;
      }

      * {
        box-sizing: border-box;
        -webkit-user-select: none;
        user-select: none;
        cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M5 3L18.5 12.5L12 13.5L15 21L11.5 22L8.5 15L5 18V3Z" fill="white" opacity="0.95"/><circle cx="5" cy="3" r="1.8" fill="white" opacity="0.95"/></svg>') 0 0, auto;
      }

      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }

      ::selection,
      ::-moz-selection {
        color: #f4f1e8;
        background: rgba(137, 119, 83, 0.72);
      }

      body {
        min-height: 100vh;
        margin: 0;
        background: #090a0a;
      }

      main {
        width: 100%;
        padding: 16px 20px 36px;
      }

      .toolbar {
        width: min(100%, 824px);
        height: 36px;
        display: flex;
        gap: 8px;
        margin: 0 auto 22px;
      }

      .back-button {
        height: 36px;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        flex: 0 0 auto;
        padding: 0 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 11px;
        background: rgba(0, 0, 0, 0.45);
        color: #aeb2b6;
        font-size: 12px;
        text-decoration: none;
        transition: color 140ms ease, border-color 140ms ease, background 140ms ease;
      }

      .back-button:hover,
      .back-button:focus-visible {
        border-color: rgba(255, 255, 255, 0.22);
        background: rgba(255, 255, 255, 0.04);
        color: #f0f1f2;
      }

      .search-wrap {
        min-width: 0;
        flex: 1;
        position: relative;
      }

      .search-wrap::before {
        content: "";
        position: absolute;
        left: 12px;
        top: 11px;
        width: 9px;
        height: 9px;
        border: 1.5px solid #85898c;
        border-radius: 50%;
      }

      .search-wrap::after {
        content: "";
        position: absolute;
        left: 21px;
        top: 21px;
        width: 5px;
        height: 1.5px;
        transform: rotate(45deg);
        background: #85898c;
      }

      .search,
      .filter {
        height: 36px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 11px;
        background: rgba(0, 0, 0, 0.45);
        color: #e4e5e5;
        font: inherit;
        font-size: 12px;
      }

      .search,
      .filter {
        cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="24" viewBox="0 0 16 24"><path d="M8 2v20M4 2h8M4 22h8" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/></svg>') 8 12, text;
      }

      .search {
        width: 100%;
        padding: 0 12px 0 30px;
        outline: none;
      }

      .search::placeholder {
        color: #8e9295;
      }

      .search:focus,
      .filter:focus {
        border-color: rgba(255, 255, 255, 0.24);
      }

      .filter {
        width: 110px;
        padding: 0 12px;
      }

      .catalogue {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
        gap: 10px;
      }

      .catalogue-item {
        min-width: 0;
        overflow: hidden;
        aspect-ratio: 1;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 9px;
        background: #141617;
      }

      .tile-link {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        overflow: hidden;
        color: #74797c;
        text-decoration: none;
        background:
          linear-gradient(135deg, rgba(255,255,255,0.018), transparent 55%),
          #151819;
      }

      .tile-link img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .tile-link:hover {
        background-color: #1a1e1f;
      }

      .tile-link span {
        position: absolute;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 1;
        padding: 12px 8px 8px;
        overflow: hidden;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.82));
        color: #f0f1f2;
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 140ms ease;
      }

      .tile-link:hover span,
      .tile-link:focus-visible span {
        opacity: 1;
      }

      .tile-link.no-cover span {
        position: relative;
        right: auto;
        bottom: auto;
        left: auto;
        width: auto;
        padding: 10px;
        border: 1px dashed rgba(255, 255, 255, 0.17);
        border-radius: 10px;
        background: transparent;
        color: #858a8d;
        opacity: 1;
      }

      @media (max-width: 560px) {
        main {
          padding: 14px 12px 28px;
        }

        .catalogue {
          grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
          gap: 7px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="toolbar">
        <a class="back-button" href="../index.html" aria-label="back to home">
          <span aria-hidden="true">←</span>
          <span>back</span>
        </a>
        <label class="search-wrap">
          <input class="search" type="search" placeholder="search..." aria-label="search catalogue" />
        </label>
        <select class="filter" aria-label="filter catalogue">
          <option>all</option>
        </select>
      </div>

      <section class="catalogue" aria-label="math catalogue">
      </section>
    </main>
    <script src="games.js"></script>
    <script>
      const backButton = document.querySelector('.back-button');
      backButton.addEventListener('click', (event) => {
        if (window.parent !== window) {
          event.preventDefault();
          window.parent.postMessage('lucent:show-home', '*');
        }
      });

      const catalogue = document.querySelector('.catalogue');
      const search = document.querySelector('.search');
      document.addEventListener('contextmenu', (event) => event.preventDefault());
      document.addEventListener('keydown', (event) => {
        if (
          event.key === 'F12' ||
          (event.ctrlKey && event.shiftKey && ['i', 'j', 'c'].includes(event.key.toLowerCase())) ||
          (event.ctrlKey && event.key.toLowerCase() === 'u')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);

      for (const game of window.gameCatalogue) {
        const item = document.createElement('article');
        item.className = 'catalogue-item';
        const link = document.createElement('a');
        link.className = 'tile-link';
        link.href = 'iframe.html?game=' + encodeURIComponent(game.name);
        link.setAttribute('aria-label', 'open ' + game.name);
        link.addEventListener('click', () => {
          window.parent.postMessage({ type: 'lucent:game-open', name: game.name }, '*');
        });
        const label = document.createElement('span');
        label.textContent = game.name;

        if (game.cover) {
          const image = document.createElement('img');
          image.src = game.cover;
          image.alt = game.name;
          image.addEventListener('error', () => {
            image.remove();
            link.classList.add('no-cover');
          });
          link.appendChild(image);
        } else {
          link.classList.add('no-cover');
        }

        link.appendChild(label);
        item.appendChild(link);
        catalogue.appendChild(item);
      }

      search.addEventListener('input', () => {
        const query = search.value.trim().toLowerCase();
        catalogue.querySelectorAll('.catalogue-item').forEach((item) => {
          item.hidden = !item.querySelector('.tile-link').getAttribute('aria-label').slice(5).toLowerCase().includes(query);
        });
      });
    </script>
  </body>
</html>
